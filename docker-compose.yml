/**
 * Docker Compose configuration for local development
 * Services: Frontend (Next.js), Backend (FastAPI), Database (PostgreSQL)
 */
version: "3.8"

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: kakeibo_db
    environment:
      POSTGRES_USER: kakeibo
      POSTGRES_PASSWORD: kakeibo_password
      POSTGRES_DB: kakeibo
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - kakeibo_network

  # FastAPI Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: kakeibo_backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      DATABASE_URL: postgresql://kakeibo:kakeibo_password@postgres:5432/kakeibo
      DEBUG: "true"
      JWT_SECRET_KEY: your-secret-key-change-in-production
    ports:
      - "8000:8000"
    depends_on:
      - postgres
    volumes:
      - ./backend:/app
    networks:
      - kakeibo_network

  # Next.js Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: kakeibo_frontend
    command: npm run dev
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - kakeibo_network

volumes:
  postgres_data:

networks:
  kakeibo_network:
    driver: bridge
