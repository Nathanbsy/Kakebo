/**
 * Docker Compose configuration for local development
 * Services: Frontend (Next.js), Backend (Node.js/TypeScript), Analytics (Python), Database (MySQL)
 */
version: "3.8"

services:
  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: kakeibo_db
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_USER: kakeibo
      MYSQL_PASSWORD: kakeibo_password
      MYSQL_DATABASE: kakeibo
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - kakeibo_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # TypeScript Backend (Node.js)
  backend:
    build:
      context: ./backend-ts
      dockerfile: Dockerfile
    container_name: kakeibo_backend
    command: npm run dev
    environment:
      NODE_ENV: development
      API_PORT: 8000
      DATABASE_URL: mysql://kakeibo:kakeibo_password@mysql:3306/kakeibo
      JWT_SECRET_KEY: your-secret-key-change-in-production
      JWT_EXPIRATION_HOURS: 24
      CORS_ORIGIN: http://localhost:3000,http://localhost:3001
      ANALYTICS_SERVICE_URL: http://analytics:8001
    ports:
      - "8000:8000"
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - ./backend-ts/src:/app/src
      - ./backend-ts/prisma:/app/prisma
    networks:
      - kakeibo_network

  # Python Analytics Service
  analytics:
    build:
      context: ./analytics-service
      dockerfile: Dockerfile
    container_name: kakeibo_analytics
    command: python -m uvicorn app.main:app --reload --host 0.0.0.0 --port 8001
    environment:
      ANALYTICS_PORT: 8001
      DEBUG: "true"
      BACKEND_URL: http://backend:8000
      GOOGLE_SHEETS_CREDENTIALS: ""
      POWERBI_API_KEY: ""
    ports:
      - "8001:8001"
    depends_on:
      - backend
    volumes:
      - ./analytics-service:/app
    networks:
      - kakeibo_network

  # Next.js Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: kakeibo_frontend
    command: npm run dev
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - kakeibo_network
    depends_on:
      - backend

volumes:
  mysql_data:

networks:
  kakeibo_network:
    driver: bridge
